name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp release download URL
        run: |
          TAG="${GITHUB_REF_NAME}"
          DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${TAG}/DM-toolkit-for-dnd5e.zip"
          jq --arg download "$DOWNLOAD" '.download = $download' module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Build module package
        run: |
          MODULE_ID="DM-toolkit-for-dnd5e"
          STAGE="build/${MODULE_ID}"
          mkdir -p "${STAGE}"
          cp -r lang scripts styles module.json README.md "${STAGE}/"
          (
            cd build
            zip -r "../${MODULE_ID}.zip" "${MODULE_ID}"
          )

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DM-toolkit-for-dnd5e.zip
            module.json
